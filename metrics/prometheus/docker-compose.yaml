version: '3.8'

services:
  app:
    image: golang:1.23-alpine
    working_dir: /app/metrics/prometheus
    volumes:
      - ../../:/app
      - ./prometheus.yml:/prometheus/prometheus.yml
    command: >
      sh -c "
        go mod tidy &&
        go build -o /tmp/pipeline_example ./example/ &&
        /tmp/pipeline_example
      "
    ports:
      - "2112:2112"
    networks:
      - pipeline-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge