<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline 实时指标</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #status { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  #status.connected { color: var(--good); }
  #status.reconnecting { color: var(--warn); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 10px 14px;
    text-align: right;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  th { background: #243244; color: var(--muted); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tr:hover { background: #263449; }
  td.name { font-weight: 600; color: var(--accent); }
  td.err { color: var(--err); font-weight: 700; }
  td.zero { color: var(--muted); }
  tr.summary { border-top: 2px solid var(--accent); }
  tr.summary td { background: #243a52; font-weight: 600; color: var(--accent); }
  .footer { margin-top: 16px; color: var(--muted); font-size: 12px; }
  .chart-wrap { margin-top: 20px; background: var(--panel); border-radius: 8px; padding: 14px; }
  .chart-title { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #trend { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; font-size: 12px; }
  .legend-item { color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<h1>Pipeline 实时指标</h1>
<div class="subtitle">SSE 实时推送 · 每帧全量快照</div>
<div id="status" class="reconnecting">正在连接…</div>
<table>
  <thead>
    <tr>
      <th>Stage</th>
      <th>吞吐 /s</th>
      <th>总数</th>
      <th>错误</th>
      <th>P50</th>
      <th>P99</th>
      <th>平均</th>
      <th>最大</th>
      <th>积压</th>
      <th>阻塞/条</th>
      <th>阻塞总</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="chart-wrap">
  <div class="chart-title">吞吐趋势（最近 60 帧）</div>
  <canvas id="trend" width="900" height="240"></canvas>
</div>
<div class="footer">数据由后端 SSE 推送 · 积压=输入队列深度 · 阻塞/条=平均每条 output 写等待耗时 · 阻塞总=累计阻塞耗时</div>

<script>
(function () {
  'use strict';
  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');

  function fmtDur(ns) {
    if (ns <= 0) return '<span class="zero">-</span>';
    if (ns < 1000) return ns + ' ns';
    if (ns < 1000000) return (ns / 1000).toFixed(1) + ' µs';
    if (ns < 1000000000) return (ns / 1000000).toFixed(2) + ' ms';
    return (ns / 1000000000).toFixed(2) + ' s';
  }

  function fmtThr(v) {
    if (v <= 0) return '<span class="zero">-</span>';
    if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
    return v.toFixed(1);
  }

  function fmtDepth(v) {
    if (v <= 0) return '<span class="zero">0</span>';
    if (v > 100) return '<span class="err">' + v + '</span>';
    return v;
  }

  function fmtBlocked(totalNs, count) {
    if (totalNs <= 0 || count <= 0) return '<span class="zero">-</span>';
    var avg = Math.round(totalNs / count);
    return fmtDur(avg);
  }

  function render(frame) {
    rowsEl.innerHTML = '';
    frame.stages.forEach(function (s) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="name">' + escapeHtml(s.name) + '</td>' +
        '<td>' + fmtThr(s.throughput) + '</td>' +
        '<td>' + s.total + '</td>' +
        '<td class="' + (s.errors > 0 ? 'err' : '') + '">' + s.errors + '</td>' +
        '<td>' + fmtDur(s.p50Ns) + '</td>' +
        '<td>' + fmtDur(s.p99Ns) + '</td>' +
        '<td>' + fmtDur(s.avgLatencyNs) + '</td>' +
        '<td>' + fmtDur(s.maxLatencyNs) + '</td>' +
        '<td>' + fmtDepth(s.queueDepth) + '</td>' +
        '<td>' + fmtBlocked(s.blockedTimeNs, s.total) + '</td>' +
        '<td>' + fmtDur(s.blockedTimeNs) + '</td>';
      rowsEl.appendChild(tr);
    });
    // 整链路汇总行（D-33）。
    if (frame.summary) {
      var s = frame.summary;
      var tr = document.createElement('tr');
      tr.className = 'summary';
      tr.innerHTML =
        '<td class="name" title="整条链路聚合">∑ 汇总</td>' +
        '<td>' + fmtThr(s.throughput) + '</td>' +
        '<td>' + s.total + '</td>' +
        '<td class="' + (s.errors > 0 ? 'err' : '') + '">' + s.errors + '</td>' +
        '<td colspan="4">' + fmtDur(s.avgLatencyNs) + ' / ' + fmtDur(s.maxLatencyNs) + '（均/均）</td>' +
        '<td>' + fmtDepth(s.queueDepth) + '</td>' +
        '<td>-</td>' +
        '<td>' + fmtDur(s.blockedTimeNs) + '</td>';
      rowsEl.appendChild(tr);
    }
    var t = new Date(frame.timestamp);
    statusEl.textContent = '已连接 · 更新于 ' + t.toLocaleTimeString();
    statusEl.className = 'connected';
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ── 吞吐趋势图（canvas 折线，保留最近 60 帧）──
  var MAX_POINTS = 60;
  var TICK_MARGIN = 40;  // 左侧留白，绘制刻度
  var hist = {};         // stage → 吞吐历史数组
  var legendEl = document.createElement('div');
  legendEl.className = 'legend';
  document.querySelector('.chart-wrap').appendChild(legendEl);

  var PALETTE = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#fb7185', '#4ade80', '#facc15'];

  function redrawTrend() {
    var canvas = document.getElementById('trend');
    var wrap = document.querySelector('.chart-wrap');
    // 适配容器宽度，保持 2.5:1 aspect。
    canvas.width = wrap.clientWidth;
    canvas.height = Math.round(wrap.clientWidth / 2.5);
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#16233a';
    ctx.fillRect(0, 0, W, H);

    // 收集所有 stage 的点数以计算 Y 轴范围。
    var names = Object.keys(hist);
    if (names.length === 0) return;

    var maxV = 1;
    names.forEach(function (n) {
      if (hist[n] && hist[n].length) {
        var m = Math.max.apply(null, hist[n]);
        if (m > maxV) maxV = m;
      }
    });
    maxV = Math.max(1, Math.ceil(maxV * 1.1));

    var plotW = W - TICK_MARGIN - 8;
    var plotH = H - 24;

    // Y 轴刻度和网格。
    ctx.strokeStyle = '#2c3e56';
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px monospace';
    for (var g = 0; g <= 4; g++) {
      var y = 4 + (plotH * g / 4);
      ctx.beginPath();
      ctx.moveTo(TICK_MARGIN, y);
      ctx.lineTo(W - 4, y);
      ctx.stroke();
      var val = (maxV * (1 - g / 4)).toFixed(0);
      ctx.fillText(val, 2, y + 4);
    }
    ctx.fillText('0s', TICK_MARGIN, H - 4);
    ctx.fillText('-' + MAX_POINTS + ' 帧', 2, H - 4);

    // 每个 stage 一条折线。
    names.forEach(function (n, idx) {
      var data = hist[n];
      if (!data || data.length < 2) return;
      var color = PALETTE[idx % PALETTE.length];
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      data.forEach(function (v, i) {
        // 最新点在右端：i=0 在左，i=MAX_POINTS-1 在右。
        var sx = TICK_MARGIN + (plotW * i / (MAX_POINTS - 1));
        var sy = 4 + plotH * (1 - v / maxV);
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      });
      ctx.stroke();
    });

    // 图例。
    legendEl.innerHTML = '';
    names.forEach(function (n, idx) {
      var item = document.createElement('span');
      item.className = 'legend-item';
      item.innerHTML = '<span class="legend-dot" style="background:' + PALETTE[idx % PALETTE.length] + '"></span>' +
        escapeHtml(n);
      legendEl.appendChild(item);
    });
  }

  function updateTrend(frame) {
    frame.stages.forEach(function (s) {
      if (!hist[s.name]) hist[s.name] = [];
      hist[s.name].push(s.throughput);
      if (hist[s.name].length > MAX_POINTS) hist[s.name].shift();
    });
    // 移除已不存在的 stage。
    var live = {};
    frame.stages.forEach(function (s) { live[s.name] = true; });
    Object.keys(hist).forEach(function (n) {
      if (!live[n]) delete hist[n];
    });
    redrawTrend();
  }

  var es = new EventSource('/metrics');
  es.onopen = function () {
    statusEl.textContent = '已连接，等待数据…';
    statusEl.className = 'connected';
  };
  es.onmessage = function (e) {
    try {
      var frame = JSON.parse(e.data);
      render(frame);
      updateTrend(frame);
    } catch (err) {
      statusEl.textContent = '数据解析失败: ' + err.message;
      statusEl.className = 'reconnecting';
    }
  };
  es.onerror = function () {
    statusEl.textContent = '连接断开，自动重连中…';
    statusEl.className = 'reconnecting';
  };

  // 窗口尺寸变化时重绘（canvas 依赖容器宽度）。
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(redrawTrend, 150);
  });
})();
</script>
</body>
</html>
