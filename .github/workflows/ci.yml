name: CI

on:
  # 仅 main 分支推送触发（tag 推送不触发，避免循环）
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git tag 操作需要完整历史

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build examples
        run: go build ./examples/...

      - name: Create and push tag
        run: |
          # version 文件格式：第一行为版本号，后续行为本版本更新项（填充到 tag 消息）
          VERSION=$(sed -n '1p' version | tr -d ' \t')
          CHANGELOG=$(sed -n '2,$p' version | tr '\n' '\n')
          TAG="v${VERSION}"
          git config user.name "CI Bot"
          git config user.email "ci@example.com"
          git config core.quotepath false
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            {
              echo "Release $TAG"
              echo ""
              echo "$CHANGELOG"
            } > /tmp/tag_message.txt
            git tag -a "$TAG" -F /tmp/tag_message.txt
            git push origin "$TAG"
            echo "Created tag $TAG with changelog"
          fi